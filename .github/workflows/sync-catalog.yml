name: Sync catalog

on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 同步上游并生成 catalog.json
        run: python3 tools/sync_catalog.py
      - name: 校验
        run: python3 tools/sync_catalog.py --validate-only
      - name: 有变化才提交
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync catalog $(date +%F)"
            for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
          fi
